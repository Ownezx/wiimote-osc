[package]
name = "wiimote-osc"
version = "0.1.0"
edition = "2021"

[dependencies]
wiiuse-rs = { git = "https://github.com/Ownezx/wiiuse-rs.git", branch = "main" }
open-sound-control = "0.9"
clap = { version = "4.6", features = ["derive"] }

# Linting rules
[lints]
workspace = true

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
missing_docs_in_private_items = "warn"
